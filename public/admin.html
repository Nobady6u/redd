<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RADD | الإدارة</title><style>body{font-family:system-ui;background:#08111f;color:#fff;margin:0;padding:20px}main{max-width:900px;margin:auto}section{background:#142438;border:1px solid #29415b;border-radius:18px;padding:20px;margin:15px 0}input,button,select{padding:12px;border-radius:10px;border:1px solid #456;background:#0b1828;color:white;margin:5px}button{cursor:pointer;background:#5de0ae;color:#08111f;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #344}small{color:#abc}</style><main><h1>رَدّ · لوحة الإدارة</h1><section><label>مفتاح الإدارة <input id="key" type="password" placeholder="ADMIN_KEY"></label><button onclick="load()">دخول / تحديث</button><p id="msg"></p></section><section><h2>إضافة منشأة</h2><input id="name" placeholder="اسم المنشأة"><input id="city" placeholder="المدينة"><input id="phone" placeholder="رقم التواصل"><input id="pid" placeholder="WhatsApp Phone Number ID"><select id="status"><option value="pending">قيد المراجعة</option><option value="active">فعّالة</option><option value="paused">متوقفة</option></select><button onclick="add()">إضافة</button></section><section><h2>إعداد رد تلقائي</h2><input id="rulepid" placeholder="Phone Number ID"><textarea id="ruletext" placeholder="نص الرد التلقائي" style="width:95%;min-height:100px"></textarea><label><input id="ruleenabled" type="checkbox">تفعيل الرد</label><button onclick="saveRule()">حفظ الرد</button><div id="rules"></div></section><section><h2>الملخص</h2><pre id="stats">—</pre></section><section><h2>المنشآت</h2><div id="businesses">—</div></section><section><h2>آخر الرسائل (200)</h2><div id="messages">—</div></section></main><script>async function api(p,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json","x-admin-key":document.getElementById("key").value};const r=await fetch(p,o);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}async function load(){try{const [b,s,m,rules]=await Promise.all([api("/api/admin/businesses"),api("/api/admin/stats"),api("/api/admin/messages"),api("/api/admin/rules")]);document.getElementById("rules").innerHTML="<p>الردود المحفوظة: "+rules.length+"</p>"+rules.map(x=>"<p>"+esc(x.phone_number_id)+" · "+(x.enabled?"مفعّل":"معطّل")+" · "+esc(x.reply_text)+"</p>").join("");document.getElementById("stats").textContent=JSON.stringify(s,null,2);document.getElementById("businesses").innerHTML="<table><tr><th>الاسم</th><th>المدينة</th><th>الحالة</th><th>Phone ID</th><th>تحديث</th></tr>"+b.map(x=>"<tr><td>"+esc(x.name)+"</td><td>"+esc(x.city||"")+"</td><td>"+esc(x.status)+"</td><td>"+esc(x.whatsapp_phone_number_id||"")+"</td><td><button onclick='toggle("+x.id+",\"active\")'>تفعيل</button><button onclick='toggle("+x.id+",\"paused\")'>إيقاف</button><button onclick='toggle("+x.id+",\"pending\")'>مراجعة</button></td></tr>").join("")+"</table>";document.getElementById("messages").innerHTML="<table><tr><th>المرسل</th><th>الرسالة</th><th>رقم واتساب</th><th>التاريخ</th></tr>"+m.map(x=>"<tr><td>"+esc(x.sender||"")+"</td><td>"+esc(x.body||"")+"</td><td>"+esc(x.phone_number_id||"")+"</td><td>"+esc(x.received_at||"")+"</td></tr>").join("")+"</table>";document.getElementById("msg").textContent="تم تحميل البيانات";}catch(e){document.getElementById("msg").textContent="تعذر التحميل: "+e.message}}async function add(){try{await api("/api/admin/businesses",{method:"POST",body:JSON.stringify({name:name.value,city:city.value,contact_phone:phone.value,phone_number_id:pid.value,status:status.value})});await load()}catch(e){msg.textContent=e.message}}async function saveRule(){try{await api("/api/admin/rules",{method:"POST",body:JSON.stringify({phone_number_id:rulepid.value,reply_text:ruletext.value,enabled:ruleenabled.checked})});await load()}catch(e){msg.textContent=e.message}}async function toggle(id,s){try{await api("/api/admin/businesses/"+id,{method:"PATCH",body:JSON.stringify({status:s})});await load()}catch(e){msg.textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}</script></html>
