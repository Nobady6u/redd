<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تشخيص دخول رَدّ</title><body style="font-family:Arial;background:#f5f5f7;padding:24px"><main style="max-width:480px;margin:auto;background:white;padding:24px;border-radius:20px"><h2>تشخيص الدخول — رَدّ</h2><p>صفحة مستقلة لا تعتمد على لوحة الإدارة المعتادة.</p><input id="k" type="password" placeholder="مفتاح الإدارة" style="width:100%;padding:14px;box-sizing:border-box"><button id="b" style="margin-top:12px;padding:14px;width:100%">اختبار المفتاح</button><p id="s">جاهز للاختبار.</p><script>document.getElementById('b').onclick=async()=>{let s=document.getElementById('s'),b=document.getElementById('b');s.textContent='تم الضغط على الزر — جارٍ إرسال الطلب';b.disabled=true;try{let r=await fetch('/api/admin/auth',{headers:{'x-admin-key':document.getElementById('k').value}});let t=await r.text();s.textContent='استجابة الخادم: HTTP '+r.status+' — '+t;}catch(e){s.textContent='خطأ اتصال: '+e.message;}finally{b.disabled=false;}};</script></main></body></html>
