<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تشخيص رَدّ</title><body style="font-family:Arial;background:#f5f5f7;padding:24px"><main style="max-width:520px;margin:auto;background:white;padding:24px;border-radius:20px"><h2>تشخيص لوحة رَدّ</h2><p>فحص الدخول واتصال قاعدة البيانات والجداول.</p><input id="k" type="password" placeholder="مفتاح الإدارة" style="width:100%;padding:14px;box-sizing:border-box"><button id="b" style="margin-top:12px;padding:14px;width:100%">فحص النظام</button><pre id="s" style="direction:ltr;white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f2f2;padding:15px;border-radius:12px">جاهز للفحص.</pre><script>document.getElementById('b').onclick=async()=>{let s=document.getElementById('s'),b=document.getElementById('b'),key=document.getElementById('k').value;b.disabled=true;s.textContent='جارٍ اختبار المفتاح…';try{let r=await fetch('/api/admin/auth',{headers:{'x-admin-key':key}});let t=await r.text();s.textContent='AUTH HTTP '+r.status+'\\n'+t;if(!r.ok)return;s.textContent+='\\nجارٍ فحص قاعدة البيانات…';let d=await fetch('/api/admin/diagnostics',{headers:{'x-admin-key':key}});let j=await d.json();s.textContent='AUTH HTTP '+r.status+' OK\\nDATABASE DIAGNOSTICS\\nHTTP '+d.status+'\\n'+JSON.stringify(j,null,2);}catch(e){s.textContent='خطأ: '+e.message;}finally{b.disabled=false;}};</script></main></body></html>
